server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never reuse an HTML entrypoint from another release.
    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Only successful content-hashed assets are immutable. A missing asset during
    # a rolling deploy must not poison browser/CDN caches with a cached 404.
    location /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        return 404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
