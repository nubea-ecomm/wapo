<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#171717"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      href="/favicon-512.png"
    />
    <script>
      try {
        const theme = localStorage.getItem('wapo-theme')
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch {}
    </script>
    <title>Wapo</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
