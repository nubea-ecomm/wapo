<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <style>
    rect { width: 11px; height: 11px; fill: #e8e8ec; opacity: .14; }
    @media (prefers-reduced-motion: no-preference) {
      rect { animation: pixel-light 7.3s ease-in-out infinite; animation-delay: -2.1s; }
      rect:nth-child(2n) { animation-duration: 9.7s; animation-delay: -6.4s; }
      rect:nth-child(3n) { animation-duration: 5.9s; animation-delay: -1.3s; }
      rect:nth-child(5n) { animation-duration: 11.3s; animation-delay: -8.7s; }
      rect:nth-child(7n) { animation-duration: 8.1s; animation-delay: -3.8s; }
      rect:nth-child(4n + 1) { animation-direction: reverse; }
      rect:nth-child(6n + 1) { animation-delay: -4.9s; }
      rect:nth-child(8n + 3) { animation-delay: -7.2s; }
    }
    @keyframes pixel-light {
      0%, 100% { opacity: .03; }
      16% { opacity: .1; }
      34% { opacity: .4; }
      48% { opacity: .32; }
      69%, 84% { opacity: .02; }
    }
  </style>
