sonar.projectKey=nubea-ecomm_wapo
sonar.organization=nubea-ecomm
sonar.projectName=Wapo
sonar.sourceEncoding=UTF-8

sonar.sources=apps/server,apps/web/src,packages/sdk/src,scripts
sonar.exclusions=apps/server/**/*_test.go,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,scripts/**/*.test.mjs
sonar.tests=apps/server,apps/web/src,packages/sdk/test,scripts
sonar.test.inclusions=apps/server/**/*_test.go,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,packages/sdk/test/**/*.test.mjs,scripts/**/*.test.mjs

sonar.go.coverage.reportPaths=apps/server/coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.coverage.exclusions=apps/web/src/main.tsx

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
