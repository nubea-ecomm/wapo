name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm build && pnpm test
      - name: Prepare isolated local configuration
        run: |
          cp .env.example .env
          sed -i 's/^REQUEST_LOG_SAMPLE_RATE=.*/REQUEST_LOG_SAMPLE_RATE=1/' .env
          echo "BOOTSTRAP_API_KEY=$(openssl rand -hex 32)" >> .env
          echo "ADMIN_API_KEY=$(openssl rand -hex 32)" >> .env
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
      - run: docker compose up --build -d api worker
      - run: make test-integration
      - run: pnpm test:contract
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            test-results/
            artifacts/
      - if: always()
        run: docker compose down
