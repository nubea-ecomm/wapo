name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --audit-level high

  go:
    name: Go quality and race checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: apps/server/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/server

  integration:
    name: PostgreSQL integration and compatibility
    needs: [javascript, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated local configuration
        run: scripts/prepare-ci-env.sh
      - run: docker compose up --build -d api worker
      - run: make test-integration
      - run: pnpm test:contract
      - if: always()
        run: docker compose down

  browser:
    name: Browser workflows
    needs: [javascript, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated local configuration
        run: scripts/prepare-ci-env.sh
      - run: docker compose up --build -d api worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build and test the production frontend
        run: |
          docker build -t wapo-web-check -f apps/web/Dockerfile .
          docker run --rm -d --name wapo-web-check -p 127.0.0.1:4173:8080 wapo-web-check
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ -o /dev/null
          pnpm exec playwright test --config playwright.production.config.ts
      - name: Browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts
          path: |
            test-results/
            artifacts/
      - if: always()
        run: |
          docker rm -f wapo-web-check 2>/dev/null || true
          docker compose down
