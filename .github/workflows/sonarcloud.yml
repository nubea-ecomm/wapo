name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Code quality and coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarCloud is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Skipping analysis until the SONAR_TOKEN repository secret is configured."

      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@v6

      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: apps/server/go.sum

      - name: Install JavaScript dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: JavaScript coverage
        if: env.SONAR_TOKEN != ''
        run: pnpm --filter @wapo/web exec vitest run --coverage --coverage.reporter=lcov

      - name: Go coverage
        if: env.SONAR_TOKEN != ''
        working-directory: apps/server
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
