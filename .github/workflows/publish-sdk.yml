name: Publish SDK to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing sdk-v* tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(inputs.release_tag || github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          git fetch origin main
          RELEASE_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          node scripts/check-sdk-release.mjs "$RELEASE_TAG"
      - run: pnpm --filter @nubea-ecomm/wapo-sdk build
      - run: pnpm test:sdk
      - name: Inspect package contents
        working-directory: packages/sdk
        run: npm pack --dry-run
      - name: Publish public package
        working-directory: packages/sdk
        run: npm publish --access public
